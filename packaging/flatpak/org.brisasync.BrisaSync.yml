app-id: org.brisasync.BrisaSync
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: brisasync

finish-args:
  # Integração de Janela e Gráficos
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

  # Comunicação de Rede (Google Drive OAuth e transferência de dados rclone)
  - --share=network

  # Acesso ao Sistema de Arquivos
  # JUSTIFICATIVA OBRIGATÓRIA: Sincronizador de pastas locais em segundo plano.
  # O usuário configura pastas arbitrárias na sua home (ex.: ~/Documentos, ~/Trabalho, ~/Projetos).
  # Portais de FileChooser pontuais não atendem à sincronização contínua por daemon sem interação.
  - --filesystem=home

  # D-Bus e Notificações do Sistema
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Background
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.brisasync.BrisaSync

modules:
  - name: rclone
    buildsystem: simple
    build-commands:
      - install -Dm755 rclone /app/lib/brisasync/bin/rclone
      - ln -sf /app/lib/brisasync/bin/rclone /app/bin/rclone
    sources:
      - type: file
        path: ../../packaging/arch/rclone-v1.75.2-linux-amd64.bin
        dest-filename: rclone

  - name: python3-dependencies
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --prefix=/app PySide6 platformdirs
    # Em builds offline/sandboxed, pacotes wheel ou runtime KDE fornecem bibliotecas Qt6

  - name: brisasync
    buildsystem: simple
    build-commands:
      - install -dm755 /app/lib/brisasync/src
      - cp -a src/brisasync /app/lib/brisasync/src/
      - install -Dm755 packaging/flatpak/brisasync-launcher.sh /app/bin/brisasync
      - install -Dm644 packaging/brisasync.desktop /app/share/applications/org.brisasync.BrisaSync.desktop
      - install -Dm644 packaging/org.brisasync.BrisaSync.metainfo.xml /app/share/metainfo/org.brisasync.BrisaSync.metainfo.xml
      - install -Dm644 src/brisasync/resources/icons/hicolor/512x512/apps/brisasync.png /app/share/icons/hicolor/512x512/apps/org.brisasync.BrisaSync.png
      - install -Dm644 src/brisasync/resources/icons/hicolor/256x256/apps/brisasync.png /app/share/icons/hicolor/256x256/apps/org.brisasync.BrisaSync.png
      - install -Dm644 src/brisasync/resources/icons/hicolor/128x128/apps/brisasync.png /app/share/icons/hicolor/128x128/apps/org.brisasync.BrisaSync.png
      - install -Dm644 src/brisasync/resources/icons/hicolor/64x64/apps/brisasync.png /app/share/icons/hicolor/64x64/apps/org.brisasync.BrisaSync.png
      - install -Dm644 src/brisasync/resources/icons/hicolor/32x32/apps/brisasync.png /app/share/icons/hicolor/32x32/apps/org.brisasync.BrisaSync.png
      - install -Dm644 src/brisasync/resources/icons/hicolor/16x16/apps/brisasync.png /app/share/icons/hicolor/16x16/apps/org.brisasync.BrisaSync.png
    sources:
      - type: dir
        path: ../..


name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Testes Linux (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependências de sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone libsecret-1-dev libsecret-tools bubblewrap libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-xinerama0

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" platformdirs PySide6

      - name: Executar testes de compatibilidade multiplataforma
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/test_platform_compat.py

      - name: Executar suíte de testes de internacionalização e correções
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/test_i18n_support.py tests/test_attention_diagnostics_and_precheck.py

  test-windows:
    name: Testes Windows
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" platformdirs PySide6

      - name: Executar testes de plataforma no Windows
        run: |
          python -m pytest tests/test_platform_compat.py tests/test_i18n_support.py


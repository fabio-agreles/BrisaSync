name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Fetch bundled rclone (Linux)
        working-directory: app
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/fetch-rclone.sh 1.75.2 linux

      - name: Fetch bundled rclone (macOS)
        working-directory: app
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p src-tauri/resources
          curl -fsSL -o /tmp/rclone.zip "https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-osx-arm64.zip"
          unzip -q /tmp/rclone.zip -d /tmp/rclone-osx
          cp /tmp/rclone-osx/rclone-v1.75.2-osx-arm64/rclone src-tauri/resources/rclone
          chmod +x src-tauri/resources/rclone

      - name: Fetch bundled rclone (Windows)
        working-directory: app
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          Invoke-WebRequest -Uri "https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-windows-amd64.zip" -OutFile "$env:TEMP\rclone.zip"
          Expand-Archive -Path "$env:TEMP\rclone.zip" -DestinationPath "$env:TEMP\rclone-win" -Force
          Copy-Item "$env:TEMP\rclone-win\rclone-v1.75.2-windows-amd64\rclone.exe" "src-tauri/resources/rclone.exe" -Force

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "BrisaSync ${{ github.ref_name }}"
          releaseBody: "Veja as notas da versão no repositório."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
